<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f3d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dominó">
  <meta name="description" content="Dominó em dupla para 4 jogadores: contra o computador ou online com os amigos, cada um no seu celular.">
  <title>Dominó em Dupla</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home" class="screen home" hidden>
    <div class="home-logo">
      <img src="icons/icon.svg" alt="" width="84" height="84">
      <h1>Dominó em Dupla</h1>
      <p>4 jogadores · 2 duplas · até 4 pontos · <span class="version">v5</span></p>
    </div>

    <label class="field">
      <span>Seu nome</span>
      <input id="name-input" maxlength="14" autocomplete="nickname" placeholder="Como te chamam na mesa?">
    </label>

    <button class="big-btn primary" id="resume-btn" hidden></button>
    <button class="big-btn" id="local-btn">🤖 Jogar contra o computador</button>
    <button class="big-btn" id="host-btn">📡 Criar sala online</button>

    <div class="join-row">
      <input id="code-input" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CÓDIGO">
      <button class="big-btn" id="join-btn">Entrar</button>
    </div>

    <p class="home-msg" id="home-msg" role="alert"></p>
    <button class="link-btn" id="home-rules-btn">Regras do jogo</button>
  </main>

  <main id="lobby" class="screen lobby" hidden></main>

  <div id="app" class="screen table" hidden>
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="scoreboard" aria-live="polite">
        <div class="team us"><span class="team-name">Nós</span><span class="team-score" id="score-us">0</span></div>
        <div class="score-sep">×</div>
        <div class="team them"><span class="team-score" id="score-them">0</span><span class="team-name">Eles</span></div>
      </div>
      <div class="round-tag" id="round-tag">Rodada 1</div>
    </header>

    <div class="net-banner" id="net-banner" hidden></div>

    <section class="seat seat-top" data-rel="2"></section>

    <section class="middle">
      <div class="seat seat-left" data-rel="3"></div>
      <div class="board" id="board" aria-label="Mesa"></div>
      <div class="seat seat-right" data-rel="1"></div>
    </section>

    <section class="me">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="hand" id="hand" role="group" aria-label="Suas pedras"></div>
    </section>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
